<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Background checks explainer</title>
<!-- Explainer video source (HCM Academy kit, tools/video/engine). Our Workforce follows Vanderbilt's screens; the requisition,
     Pending Workers, and Convert pages follow standard Oracle and the course text (see the course's Screen check).
     Names are fictional. Formstack is outside Oracle, so that step is a card. Every caption and narration line comes
     from the course "Background checks". -->
<link rel="stylesheet" href="engine/engine.css" />
</head>
<body>
<div id="stage"><div id="cam"></div></div>
<script src="engine/engine.js"></script>
<script src="req-pages.js"></script>
<script src="convert-pages.js"></script>
<script>
VIDEO.set({ H:2000, steps:6 });
var person = { name:'Casey Rivera', wtype:'Employee', start:'12/7/2026', pos:'BIO-PC-01 Program Coordinator',
  ban:{ ini:'CR', c:'#4A6FA5', name:'Casey Rivera', sub:'Pending worker · Program Coordinator · Proposed start 12/7/2026' } };
var X = function(k){ return convertSection(k, { pos:person.pos, hours:'30', ptype:'Staff exempt', whySum:'Hire · Employment',
  asgSum:'', mgrSum:'' }); };
convertPages({ person:person, toast:'',
  sections:[['pay', 'Payroll Details (payroll relationship)'], ['sal', 'Salary']], flow:['why', 'bio', 'att'].map(X) });
reqCommon();
reqPage({ id:'a', title:'Program Coordinator', loc:'Nashville', sum3:'Standard · Vanderbilt · Nashville', csp:'Standard', acct:'VAN000' });
reqPage({ id:'n', title:'Research Coordinator (New York)', loc:'New York', sum3:'Standard · Vanderbilt · New York', csp:'New York', acct:'VAN09' });

VIDEO.addCard(C.card({ id:'intro', h:'big', eyebrow:'HCM Academy · Hiring', pre:'Clear the background ', em:'check', post:' first.', rule:true,
  p:'Most hires need a background check before they can start. For staff on a requisition, it runs through recruiting automatically. Your part: set it up right, and wait for clearance before you convert.', meta:'Oracle Recruiting · Background checks' }));
VIDEO.addCard(C.card({ id:'form', theme:'cream', eyebrow:'Step 6 of 6 · Outside Oracle', pre:'No requisition? Request it ', em:'manually', post:'.', top:220,
  p:'For populations hired without a requisition, there is no requisition to carry the check. Request the background check through Formstack.', meta:'Formstack · Manual background check request' }));
VIDEO.addCard(C.card({ id:'out', eyebrow:'Watch-outs', pre:'Two things to ', em:'remember', post:'.',
  items:['Work with minors set to Yes adds a protection of minors check.', 'Not sure where a candidate stands? Ask central recruiting before you create a direct hire.'], meta:'Questions: pcb@vanderbilt.edu' }));

seg(); card('intro'); scene('home'); wait(3.5); hold(-.5);
card('intro', false);
capS(1, 'On the requisition: mark Work with minors, Fingerprinting, or MVR if the role needs them. Configuration: HireRight and account VAN000.');
wait(.3); press('#tab-wf', function(){ flag('tab-wf'); }, .9); press('#app-hiring', null, .9); scene('hiring'); wait(.3);
press('#h-reqs span', null, .8); scene('reqs'); wait(.3); press('#b-create', function(){ reqAt('a', 4); }, .8); scene('a'); wait(.3);
camTo('#as4', 1.15, .9, 55, 100); wait(.4);
press('#af-fp', function(){ val('afp', 'No'); }, .6); press('#af-mvr', function(){ val('amvr', 'No'); }, .5); pick('#af-min', 'add-min', '#ao-miny', 'amin', 'Yes'); wait(.3);
press('#ac4', function(){ reqAt('a', 8); }); camTo('#as8', 1.15, .9, 55, 120); wait(.4);
pick('#af-csp', 'add-csp', '#ao-cstd', 'acsp', 'Standard'); hl('#af-ven'); wait(.7); hl(null);
move('#af-acct', .8); click(function(){ flag('add-acct'); }); wait(.9); move('#ao-a0', .5); click(function(){ flag('add-acct', false); val('aacct', 'VAN000'); }); wait(.2);
mark(1); hold(-.3);
capS(2, 'New York: the New York candidate selection process and account VAN09. It sends the candidate to HireRight when selected for offer.');
camTo(null, 1, .5); scene('n'); reqAt('n', 8); wait(.3); camTo('#ns3', 1.15, .9, 55, 100); hl('#nf-loc'); wait(1.2); hl(null);
camTo('#ns8', 1.15, .9, 55, 120); wait(.4);
pick('#nf-csp', 'ndd-csp', '#no-cny', 'ncsp', 'New York'); pick('#nf-acct', 'ndd-acct', '#no-a9', 'nacct', 'VAN09'); mark(2); hold(-.3);
capS(3, 'The recruiter picks the packages at the offer. When you submit, ignore the background check packages pop-up.');
camTo(null, 1, .5); scene('a'); reqAt('a', 9); flag('acan-submit'); wait(.4);
press('#ab-save'); press('#ab-submit', function(){ flag('apkg'); }); wait(.6); mark(3, '#apkg'); hold(-1.2);
press('#ab-pkg', function(){ flag('apkg', false); }); hold(-.2);
capS(4, 'PEBC clears the check. That creates the pending worker, and PEBC emails you clear to start.');
scene('home'); flag('tab-wf'); wait(.6); press('#qa-pending span', null, .9); scene('pw'); wait(.4);
hl('#r-p'); wait(1.2); mark(4, '#r-p'); hold(-.3); hl(null);
capS(5, 'Then convert. PEBC records citizenship on the application: in Convert, click the pencil and confirm it.');
press('#kb', function(){ flag('m-kb'); }); wait(.3); press('#m-conv', function(){ flag('m-kb', false); }, .6); scene('pick'); wait(.3);
press('#b-pick', function(){ flag('conv'); flag('xwhy-done'); }); scene('conv'); wait(.3); camTo('#xbio', 1.15, .9, 55, 120); wait(.4);
press('#f-cit', function(){ flag('dd-cit'); }); press('#o-yes', function(){ flag('dd-cit', false); val('cit', 'Yes'); }, .5); mark(5, '#f-cit'); hold(-.3);
capS(6, 'Not on a requisition? Request the background check manually through Formstack.');
card('form'); wait(2.8); mark(6); hold(-.6);
seg(); card('out'); wait(.6); card('form', false); camTo(null, 1, 0); wait(1.4); hold(-2.2);
VIDEO.run();
</script>
</body>
</html>
